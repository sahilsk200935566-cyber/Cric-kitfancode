<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live Match // RKTV Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.9/dist/controls.css">
<style>
    html, body {
        width: 100vw !important; height: 100dvh !important;
        margin: 0 !important; padding: 0 !important; overflow: hidden !important;
        background: #000 !important; touch-action: manipulation; user-select: none;
    }
    .shaka-video-container { 
        position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; background: #000 !important; overflow: hidden !important; z-index: 1000 !important;
    }
    video { width: 100vw !important; height: 100dvh !important; position: absolute !important; inset: 0 !important; margin: auto !important; object-fit: contain !important; }
    video.mode-cover { object-fit: cover !important; }
    video.mode-fill { object-fit: fill !important; }

    #custom-logo { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; z-index: 1001; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: none; }
    #watermark { position: absolute; bottom: 85px; left: 20px; color: rgba(255,255,255,0.4); font-size: 14px; font-weight: bold; z-index: 1001; pointer-events: none; }
    
    #lock-overlay { position: absolute; inset: 0; z-index: 999999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); touch-action: none; }
    .lock-btn { padding: 14px 28px; background: white; border-radius: 20px; cursor: pointer; font-weight: bold; color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .locked-player .shaka-controls-container, .locked-player .shaka-bottom-controls { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    .custom-ctrl-btn { background: transparent !important; border: none !important; cursor: pointer !important; padding: 0 8px !important; }
    #brightness-overlay { position: absolute; inset: 0; background: black; opacity: 0; pointer-events: none; z-index: 5; }
    
    #gesture-toast {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 22px; border-radius: 12px; 
        font-size: 15px; font-weight: bold; z-index: 9999; display: none; pointer-events: none; align-items: center; gap: 8px;
    }

    #loading-overlay { position: absolute; inset: 0; background: #000; z-index: 10005; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 20px; color: #fff; font-weight: bold; }
    
    .shaka-controls-container { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; }
    .shaka-bottom-controls { position: absolute !important; bottom: 0 !important; left: 0 !important; right: 0 !important; display: flex !important; flex-direction: column !important; padding: 0 10px 14px 10px !important; z-index: 10000 !important; }
</style>
</head>
<body>

<div class="shaka-video-container" id="pc">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-label">Loading Live Stream...</div>
    </div>

    <div id="brightness-overlay"></div>
    <div id="gesture-toast"></div>
    
    <img id="custom-logo" src="https://i.ibb.co/qLtth6tq/RKTV-LIVE-20261028-085709.jpg" alt="Logo">
    <div id="watermark">RKTV.LIVE</div>
    <div id="lock-overlay"><div class="lock-btn" id="unlock">🔒 Tap to Unlock</div></div>
    
    <video id="v" autoplay playsinline preload="metadata"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.9/dist/shaka-player.ui.min.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id') || 'default';

// Default Demo Stream (Aap ise apne API ke hisab se dynamic bhi kar sakte hain)
const STREAM_CONFIG = {
    url: "https://otte.live.fly.ww.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd",
    clearKeys: { 
        "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b"
    },
    referer: "https://www.amazon.com/gp/"
};

const video = document.getElementById('v');
const container = document.getElementById('pc');
const loadingOverlay = document.getElementById('loading-overlay');
const toast = document.getElementById('gesture-toast');

function showToast(text, duration = 1500) { 
    toast.textContent = text; toast.style.display = 'flex'; 
    setTimeout(() => { toast.style.display = 'none'; }, duration); 
}

document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const player = new shaka.Player();
    await player.attach(video);

    const ui = new shaka.ui.Overlay(player, container, video);
    const panel = container.querySelector('.shaka-controls-button-panel');

    // Lock Screen Button
    const lockBtn = document.createElement('button'); lockBtn.className = 'custom-ctrl-btn'; lockBtn.innerHTML = '🔒';
    const lock = document.getElementById('lock-overlay');
    const unlockBtn = document.getElementById('unlock');
    
    lockBtn.onclick = (e) => { e.stopPropagation(); lock.style.display = 'flex'; container.classList.add('locked-player'); };
    unlockBtn.onclick = (e) => { e.stopPropagation(); lock.style.display = 'none'; container.classList.remove('locked-player'); };
    if(panel) panel.appendChild(lockBtn);

    try {
        player.getNetworkingEngine().registerRequestFilter((type, req) => {
            if (STREAM_CONFIG.referer) req.headers["Referer"] = STREAM_CONFIG.referer;
        });

        player.configure({
            drm: { clearKeys: STREAM_CONFIG.clearKeys },
            streaming: { lowLatencyMode: true, bufferingGoal: 10 }
        });

        await player.load(STREAM_CONFIG.url);
        loadingOverlay.classList.add('hidden');
    } catch (e) {
        loadingOverlay.innerHTML = '<div class="loading-label" style="color:#ef4444;">Stream Offline or Error</div>';
    }
});
</script>
</body>
</html>
