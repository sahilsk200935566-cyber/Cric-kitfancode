<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>FC Play - Live Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 16px;
  font-size: 20px;
  font-weight: bold;
  color: #ff7518;
}

.player-box {
  width: 100%;
  max-width: 1000px;
  margin: 20px auto;
  padding: 12px;
}

video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid #252525;
  border-radius: 12px;
}

.status {
  margin-top: 14px;
  padding: 14px;
  border-radius: 8px;
  background: #151515;
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

button {
  padding: 12px 18px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: #f97316;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
}

footer {
  padding: 20px;
  text-align: center;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>
<header>FC PLAY</header>

<main class="player-box">
  <video id="video"
         controls
         playsinline
         preload="metadata">
  </video>

  <div class="status" id="status">
    Loading player...
  </div>

  <button id="retry" type="button">
    Retry Stream
  </button>
</main>

<footer>
  FC - CRICKET NEWS POINT
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

<script>
const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const retryButton = document.getElementById("retry");

let hls = null;

function showStatus(message) {
  statusBox.textContent = message;
}

function getStreamUrl() {
  const params = new URLSearchParams(location.search);
  return params.get("src") || "";
}

function startPlayer() {
  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  const streamUrl = getStreamUrl();

  if (!streamUrl) {
    showStatus(
      "Stream URL missing. Open this page with ?src=YOUR_AUTHORIZED_HLS_URL"
    );
    return;
  }

  let parsedUrl;

  try {
    parsedUrl = new URL(streamUrl);
  } catch (error) {
    showStatus("Invalid stream URL.");
    return;
  }

  if (parsedUrl.protocol !== "https:") {
    showStatus("Please use a secure HTTPS stream URL.");
    return;
  }

  if (Hls.isSupported()) {
    hls = new Hls();

    hls.loadSource(parsedUrl.href);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      showStatus("Stream ready. Press Play to watch.");
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        showStatus(
          "Unable to play this stream. It may be expired, " +
          "unavailable, or blocked by the server."
        );
        hls.destroy();
        hls = null;
      }
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = parsedUrl.href;

    video.addEventListener("loadedmetadata", function() {
      showStatus("Stream ready. Press Play to watch.");
    }, { once: true });

    video.addEventListener("error", function() {
      showStatus("Stream failed to load. Check the URL.");
    }, { once: true });

  } else {
    showStatus("This browser does not support HLS playback.");
  }
}

retryButton.addEventListener("click", startPlayer);

startPlayer();
</script>
</body>
</html>
