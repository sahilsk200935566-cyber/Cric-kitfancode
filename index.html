<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="All your live cricket in one place — live matches, live scores, trending highlights and instant alerts from FC - CRICKET NEWS POINT." />
    <title>FC - CRIC KIT - Live Stream | Live Score & Match Updates</title>
    <link rel="icon" href="/gop-gop-moww.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-dark: #050505;
        --bg-card: rgba(255, 255, 255, 0.04);
        --primary: #f97316;
        --text-main: #ffffff;
        --text-muted: #94a3b8;
        --glass-border: 1px solid rgba(255, 255, 255, 0.09);
        --radius: 18px;
        --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
      body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden; }
      #bg-layer { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; opacity: 0.22; pointer-events: none; }
      .app { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 0 20px; }
      header { padding: 30px 0 16px; display: flex; flex-direction: column; gap: 14px; }
      .title { font-size: 1.85rem; font-weight: 800; color: #ff5e3a; background: linear-gradient(135deg, #ff6b4a 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .last-update { color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
      .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .lang-select { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; font-size: 0.92rem; padding: 11px 40px 11px 18px; border-radius: 12px; outline: none; cursor: pointer; }
      .join-btn { background: #0080ff; color: #fff; padding: 11px 22px; border-radius: 11px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
      .controls { margin: 12px 0 32px; width: 100%; }
      .search-wrap input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 14px 22px; border-radius: 14px; outline: none; font-size: 0.92rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; min-height: 300px; }
      .card { background: rgba(18, 18, 22, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: var(--transition); }
      .card:hover { transform: translateY(-6px); border-color: rgba(249, 115, 22, 0.4); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
      .thumb-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #0a0a0f; }
      .thumb-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
      .corner-ribbon { position: absolute; top: 12px; left: 12px; background: #ef4444; color: #fff; font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
      .meta { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
      .teams { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
      .event { font-size: 0.82rem; color: #94a3b8; margin-bottom: 14px; }
      .btn-watch { width: 100%; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; display: block; }
      .loading-state, .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-muted); }
      footer { text-align: center; padding: 40px 0; color: rgba(255,255,255,0.45); font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 50px; }
    </style>
  </head>
  <body>
    <div id="bg-layer" style="background-image: url('https://wallpapercat.com/w/full/4/e/9/185978-3840x2160-desktop-4k-moon-background-photo.jpg')"></div>
    <div class="app">
      <header>
        <div class="brand">
          <h1 class="title">CRIC KIT Fancode Inc.</h1>
          <div class="last-update" id="lastUpdate">Last Update: Live</div>
        </div>
        <div class="header-actions">
          <select class="lang-select" id="langSelect">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="bn">বাংলা</option>
          </select>
          <a class="join-btn" href="https://whatsapp.com/channel/0029Vb6Ckmn1noz7GiJlsP3P" target="_blank">Join WhatsApp</a>
        </div>
      </header>

      <div class="controls">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Search team or event..." />
        </div>
      </div>

      <div id="matchesGrid" class="grid">
        <div class="loading-state">Loading live & upcoming events...</div>
      </div>

      <footer>
        <div>© 2026 CnpTV Fancode Inc. • All Rights Reserved</div>
      </footer>
    </div>

    <script>
      const CNPTV_SOURCE = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fan.json';
      const WORLD_SOURCE = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
      const PLAYER_PAGE = 'play.html';

      const grid = document.getElementById('matchesGrid');
      const searchInput = document.getElementById('searchInput');
      let allMatches = [];

      function buildPlayerUrl(id, langCode, streamIndex = 0){
        return `${PLAYER_PAGE}?id=${encodeURIComponent(id)}&s=${streamIndex}`;
      }

      function renderGrid(matches){
        if(!matches.length){
          grid.innerHTML = '<div class="empty-state">No matches found.</div>';
          return;
        }
        grid.innerHTML = matches.map(m => `
          <article class="card">
            <div class="thumb-wrap">
              <img src="${m.image || '/gop-gop-moww.png'}" alt="${m.title}" loading="lazy">
              <div class="corner-ribbon">${m.status || 'LIVE'}</div>
            </div>
            <div class="meta">
              <div>
                <div class="teams">${m.title}</div>
                <div class="event">${m.tournament || 'Cricket Match'}</div>
              </div>
              <div class="actions" style="margin-top: 14px;">
                <a class="btn-watch" href="${buildPlayerUrl(m.match_id || m.id || 'match', 'eng', 0)}">▶ Watch Now</a>
              </div>
            </div>
          </article>
        `).join('');
      }

      async function loadMatches(){
        try {
          const res = await fetch(WORLD_SOURCE, {cache: 'no-store'});
          const data = await res.json();
          allMatches = data.matches || [];
          renderGrid(allMatches);
        } catch(e) {
          // Fallback sample match if API fails
          allMatches = [{
            match_id: 'sample_1',
            title: 'India vs New Zealand - Live Stream',
            tournament: 'International T20 Series',
            status: 'LIVE',
            image: 'https://wallpapercat.com/w/full/4/e/9/185978-3840x2160-desktop-4k-moon-background-photo.jpg'
          }];
          renderGrid(allMatches);
        }
      }

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = allMatches.filter(m => 
          (m.title && m.title.toLowerCase().includes(q)) || 
          (m.tournament && m.tournament.toLowerCase().includes(q))
        );
        renderGrid(filtered);
      });

      loadMatches();
    </script>
  </body>
</html>
