      :root {
  --bg-dark: #050505;

* {

html, body {

}

body {

  padding-bottom: 40px;

  background-repeat: no-repeat;

}

  content: &#39;&#39;;

  background: radial-gradient(circle at 50% 25%, transparent 0%, rgba(5, 5, 5, 0.82) 100%);

header {

  background-repeat: no-repeat;
  background-position: right 14px center;

}

  background: #0f172a;

}

.lang-select:hover,
.lang-select:focus {
  background-color: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
}

/* Telegram Button (Animated Rotating Border Beam Glow Effect) */
.join-btn {
  appearance: none;

  background: transparent;
  border: none;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.join-btn::before {
  content: &#39;&#39;;
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 0deg, transparent 0%, #0080ff 30%, #38bdf8 50%, #ffffff 60%, #0080ff 75%, transparent 100%);

.join-btn-inner {

.join-btn:hover .join-btn-inner {

.join-btn svg {
  flex: none;

}

/* Search Bar */
.controls {
  margin: 12px 0 32px;
  width: 100%;
}

.search-wrap {
  position: relative;
  width: 100%;
}

.search-wrap svg {
  position: absolute;

  font-weight: 600;
  padding: 14px 22px 14px 52px;

}

.search-wrap input::placeholder {
  color: #64748b;

}

.search-wrap input:focus {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(249, 115, 22, 0.6);
  box-shadow: 0 0 24px rgba(249, 115, 22, 0.25);
}

/* Matches Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 25px;
  min-height: 300px;
}

.loading-state,
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 56px 20px;
  color: var(--text-muted);
  font-size: 0.95rem;
  font-weight: 500;
  background: var(--bg-card);
  border: var(--glass-border);
  border-radius: var(--radius);
}

.loading-state::before {
  content: &#39;&#39;;
  display: block;
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255, 255, 255, 0.1);
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin 1s linear infinite;
}

/* Match Card Box: Rich Dark Background + Subtle Orange Border on Hover */
.card {
  background: rgba(18, 18, 22, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: fadeIn 0.45s ease forwards;
}

.card:hover {
  transform: translateY(-8px);
  background: rgba(26, 26, 32, 0.85);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(249, 115, 22, 0.15);
  border-color: rgba(249, 115, 22, 0.35);
}

/* 16:9 Widescreen Poster with Smooth Zoom */
.thumb-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  overflow: hidden;
  background: #0a0a0f;
}

.thumb-wrap img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.card:hover .thumb-wrap img {
  transform: scale(1.1);
}

/* Corner Ribbon / Stamp (45-degree Angled Stamp on Top-Left Corner) */
.corner-ribbon-wrap {
  position: absolute;
  top: 0;
  left: 0;
  width: 95px;
  height: 95px;
  overflow: hidden;
  z-index: 5;
  pointer-events: none;
}

.corner-ribbon {
  position: absolute;
  top: 18px;
  left: -28px;
  width: 120px;
  padding: 4px 0;
  transform: rotate(-45deg);
  text-align: center;
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #ffffff;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.corner-ribbon.live {
  background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
  animation: ribbonPulse 2s infinite;
}

.corner-ribbon.live::before {
  content: &#39;&#39;;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 6px #ffffff;
}

.corner-ribbon.upcoming {
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.45);
}

.corner-ribbon.completed {
  background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
  color: #cbd5e1;
}

@keyframes ribbonPulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
  70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }

  // Pattern 2: &#34;02 October 2026 11:15 PM&#34; or &#34;2 Oct 2026 11:15:00 PM&#34;
  const months = {january:0,jan:0,february:1,feb:1,march:2,mar:2,april:3,apr:3,may:4,
                  june:5,jun:5,july:6,jul:6,august:7,aug:7,september:8,sep:8,sept:8,
                  october:9,oct:9,november:10,nov:10,december:11,dec:11};
  const m2 = s.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(m2){
    let [,day,monthName,year,hour,min,sec,ampm] = m2;
    const mo = months[monthName.toLowerCase()];
    if(mo !== undefined){
      hour = +hour; min = +min; day = +day; year = +year;
      if(ampm &amp;&amp; ampm.toUpperCase() === &#39;PM&#39; &amp;&amp; hour &lt; 12) hour += 12;
      if(ampm &amp;&amp; ampm.toUpperCase() === &#39;AM&#39; &amp;&amp; hour === 12) hour = 0;
      return new Date(year, mo, day, hour, min, sec ? +sec : 0);
    }
  }

  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function parseUpdatedAt(str){
  if(!str) return null;
  const m = String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2}):(\d{2})\s*(am|pm)/i);
  if(!m){ const d = new Date(str); return isNaN(d) ? null : d; }
  let day=+m[1],month=+m[2],year=+m[3],hour=+m[4],min=+m[5],sec=+m[6];
  const ampm = m[7].toLowerCase();
  if(ampm === &#39;pm&#39; &amp;&amp; hour &lt; 12) hour += 12;
  if(ampm === &#39;am&#39; &amp;&amp; hour === 12) hour = 0;
  return new Date(year, month-1, day, hour, min, sec);
}

function getOrdinal(n) {
  const s = [&#39;th&#39;, &#39;st&#39;, &#39;nd&#39;, &#39;rd&#39;], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function formatMatchTime(date, isLive){
  if(!date) return isLive ? &#39;Live Now&#39; : &#39;Time TBA&#39;;

  let h = date.getHours();
  const mm = String(date.getMinutes()).padStart(2, &#39;0&#39;);
  const ap = h &gt;= 12 ? &#39;PM&#39; : &#39;AM&#39;;
  h = h % 12; if(h === 0) h = 12;
  const timeStr = `${h}:${mm} ${ap}`;

  const now = new Date();
  const isSameDay = date.getFullYear() === now.getFullYear() &amp;&amp;
                    date.getMonth() === now.getMonth() &amp;&amp;
                    date.getDate() === now.getDate();

  const monthNames = [&#39;January&#39;,&#39;February&#39;,&#39;March&#39;,&#39;April&#39;,&#39;May&#39;,&#39;June&#39;,&#39;July&#39;,&#39;August&#39;,&#39;September&#39;,&#39;October&#39;,&#39;November&#39;,&#39;December&#39;];
  const dateStr = `${getOrdinal(date.getDate())} ${monthNames[date.getMonth()]}`;

  if(isLive){
    if(isSameDay){
      return `Live Started At ${timeStr}`;
    } else {
      return `Live Started At ${timeStr}, ${dateStr}`;
    }
  } else {
    if(isSameDay){
      return `Starts Today, ${timeStr}`;
    } else {
      return `${dateStr}, ${timeStr}`;
    }
  }
}

function formatAbsoluteIST(date){
  if(!date) return &#39;Unavailable&#39;;
  const monthNames = [&#39;Jan&#39;,&#39;Feb&#39;,&#39;Mar&#39;,&#39;Apr&#39;,&#39;May&#39;,&#39;Jun&#39;,&#39;Jul&#39;,&#39;Aug&#39;,&#39;Sep&#39;,&#39;Oct&#39;,&#39;Nov&#39;,&#39;Dec&#39;];
  const dayStr = String(date.getDate()).padStart(2, &#39;0&#39;);
  const monthStr = monthNames[date.getMonth()];
  let h = date.getHours();
  const mm = String(date.getMinutes()).padStart(2, &#39;0&#39;);
  const ap = h &gt;= 12 ? &#39;PM&#39; : &#39;AM&#39;;
  h = h % 12; if(h === 0) h = 12;
  return `${dayStr} ${monthStr}, ${h}:${mm} ${ap} IST`;
}

async function translateBatch(texts, targetLang){
  if(targetLang === &#39;en&#39;) return texts;
  const cacheKey = `${targetLang}::${texts.join(&#39;||&#39;)}`;

  if(translationCache[cacheKey]) return translationCache[cacheKey];

  const savedCache = localStorage.getItem(`fc_translation_${targetLang}`);
  if(savedCache){
    try{
      const parsedCache = JSON.parse(savedCache);
      if(Array.isArray(parsedCache) &amp;&amp; parsedCache.length){
        const lookup = {};
        parsedCache.forEach(item =&gt; {
          if(item &amp;&amp; typeof item.source === &#39;string&#39;){
            lookup[item.source] = item.translated;
          }
        });

        if(texts.every(text =&gt; !text || Object.prototype.hasOwnProperty.call(lookup, text))){
          const cachedResults = texts.map(text =&gt;
            text ? lookup[text] : &#39;&#39;
          );
          translationCache[cacheKey] = cachedResults;
          return cachedResults;
        }
      }
    }catch(e){}
  }

  try {
    const results = await Promise.all(texts.map(async (text) =&gt; {
      if(!text) return &#39;&#39;;

      const url =
        &#39;https://translate.googleapis.com/translate_a/single&#39; +
        &#39;?client=gtx&amp;sl=en&amp;tl=&#39; + encodeURIComponent(targetLang) +
        &#39;&amp;dt=t&amp;q=&#39; + encodeURIComponent(text);

      const res = await fetch(url, {cache:&#39;no-store&#39;});
      if(!res.ok) throw new Error(&#39;Translation request failed&#39;);

      const data = await res.json();
      const parts = Array.isArray(data) &amp;&amp; Array.isArray(data[0]) ? data[0] : [];
      const result = parts
        .map(part =&gt; Array.isArray(part) ? (part[0] || &#39;&#39;) : &#39;&#39;)
        .join(&#39;&#39;);

      return result || text;
    }));

    translationCache[cacheKey] = results;

    const storedMap = {};
    try{
      const stored = JSON.parse(
        localStorage.getItem(`fc_translation_${targetLang}`) || &#39;[]&#39;
      );

      if(Array.isArray(stored)){
        stored.forEach(item =&gt; {
          if(item &amp;&amp; typeof item.source === &#39;string&#39;){
            storedMap[item.source] = item.translated;
          }
        });
      }
    }catch(e){}

    texts.forEach((source, index) =&gt; {
      storedMap[source] = results[index];
    });

    try{
      localStorage.setItem(
        `fc_translation_${targetLang}`,
        JSON.stringify(
          Object.entries(storedMap).map(([source, translated]) =&gt; ({
            source,
            translated
          }))
        )
      );
    }catch(e){}

    return results;
  } catch(e){}

  return texts;
}

function filterMatchesByQuery(matches, query){
  if(!query) return matches;
  return matches.filter(m =&gt; {
    const tr = currentTranslations[m.id];
    const tTitle = tr &amp;&amp; tr.title ? tr.title.toLowerCase() : &#39;&#39;;
    const tTour = tr &amp;&amp; tr.tournament ? tr.tournament.toLowerCase() : &#39;&#39;;
    return (
      m.title.toLowerCase().includes(query) ||
      m.tournament.toLowerCase().includes(query) ||
      tTitle.includes(query) ||
      tTour.includes(query)
    );
  });
}

let currentTranslations = {};

async function renderGridWithTranslation(matches){
  if(!matches.length){
    grid.innerHTML = &#39;&lt;div class=&#34;empty-state&#34;&gt;No matches found.&lt;/div&gt;&#39;;
    return;
  }

  if(currentLang === &#39;en&#39;){
    currentTranslations = {};
    const q = searchInput.value.trim().toLowerCase();
    renderGrid(filterMatchesByQuery(matches, q), {});
    return;
  }

  const titles = matches.map(m =&gt; m.title);
  const tournaments = matches.map(m =&gt; m.tournament);
  const allTexts = [...titles, ...tournaments];

  const langName = LANG_NAMES[currentLang] || currentLang;
  translateMsg.textContent = `Translating to ${langName}…`;
  translateIndicator.classList.add(&#39;visible&#39;);
  isTranslating = true;

  try {
    const translated = await translateBatch(allTexts, currentLang);
    const translatedTitles = translated.slice(0, titles.length);
    const translatedTournaments = translated.slice(titles.length);
    currentTranslations = {};
    matches.forEach((m, i) =&gt; {
      currentTranslations[m.id] = {
        title: translatedTitles[i],
        tournament: translatedTournaments[i]
      };
    });
  } catch(e){
    currentTranslations = {};
  }

  translateIndicator.classList.remove(&#39;visible&#39;);
  isTranslating = false;

  const q = searchInput.value.trim().toLowerCase();
  renderGrid(filterMatchesByQuery(matches, q), currentTranslations);
}

function renderGrid(matches, translations){
  if(!matches.length){
    grid.innerHTML = &#39;&lt;div class=&#34;empty-state&#34;&gt;No matches found.&lt;/div&gt;&#39;;
    return;
  }
  grid.innerHTML = matches.map(m =&gt; renderCard(m, translations ? translations[m.id] : null)).join(&#39;&#39;);
}

function buildMatches(cnptvData, worldData){
  const cnptvMap = {};
  (cnptvData.matches || []).forEach(m =&gt; { cnptvMap[m.match_id] = m; });
  const matches = (worldData.matches || []).map(m =&gt; {
    const status = String(m.status || &#39;&#39;).toUpperCase();
    const isLive = status === &#39;LIVE&#39;;
    const cnptv = cnptvMap[m.match_id];
    const cnptvUrl = cnptv &amp;&amp; cnptv.cnptv_cdn ? cnptv.cnptv_cdn : null;
    const streams = m.streams || {};
    return {
      id: String(m.match_id || &#39;&#39;),
      category: m.category || &#39;&#39;,
      title: m.title || &#39;Match&#39;,
      tournament: m.tournament || &#39;&#39;,
      image: m.image || FALLBACK_IMG,
      status: status === &#39;LIVE&#39; || status === &#39;COMPLETED&#39; ? status : &#39;UPCOMING&#39;,
      language: m.language,
      broadcasts: availableBroadcasts(m),
      sonuPx: Object.values(m.auto_streams||{}).map(v=&gt;v&amp;&amp;v.sonu_px).find(Boolean) || null,
      isLive,
      time: parseMatchTime(m.startTime),
      langCode: langToCode(m.language, isLive),
      cnptvUrl: cnptvUrl || streams.primary || streams.fancode_cdn || null,
      primary: streams.primary || null,
      fancodeCdn: streams.fancode_cdn || null,
      backup: streams.backup || {},
      autoStreams: m.auto_streams || {},
      lk: streams.fancode_lk_cdn || null,
      np: streams.fancode_np_cdn || null,
      bd: streams.fancode_bd_cdn || null
    };
  });
  matches.sort((a,b) =&gt; {
    if(a.isLive !== b.isLive) return a.isLive ? -1 : 1;
    const at = a.time ? a.time.getTime() : Infinity;
    const bt = b.time ? b.time.getTime() : Infinity;
    return at - bt;
  });
  return matches;
}

async function refresh(isFirstLoad){
  try{
    const [cnptvData, worldData] = await Promise.all([
      fetch(CNPTV_SOURCE,{cache:&#39;no-store&#39;}).then(r =&gt; r.json()).catch(() =&gt; ({matches:[]})),
      fetch(WORLD_SOURCE,{cache:&#39;no-store&#39;}).then(r =&gt; r.json())
    ]);
    lastUpdatedAt = parseUpdatedAt(worldData.updatedAt) || new Date();
    const snapshot = JSON.stringify(worldData.matches || []);
    if(!isFirstLoad &amp;&amp; snapshot === lastWorldSnapshot){
      lastUpdateEl.textContent = &#39;Last Update: &#39; + formatAbsoluteIST(lastUpdatedAt);
      return;
    }
    lastWorldSnapshot = snapshot;
    allMatches = buildMatches(cnptvData, worldData);
    await renderGridWithTranslation(allMatches);
    lastUpdateEl.textContent = &#39;LAST UPDATE: &#39; + formatAbsoluteIST(lastUpdatedAt);
  } catch(err){
    if(isFirstLoad){
      grid.innerHTML = &#39;&lt;div class=&#34;empty-state&#34;&gt;Couldn\&#39;t load the match board. Try refreshing.&lt;/div&gt;&#39;;
      lastUpdateEl.textContent = &#39;Last Update: Unavailable&#39;;
    }
  }
}
