<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Cric Kit Fancode
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
      :root[data-theme=&#34;dark&#34;],
:root:not([data-theme=&#34;light&#34;]) {
  --bg: #08070b;
  --bg-soft: #0e0c13;
  --surface: #131019;
  --surface-2: #1b1723;
  --border: #2a2434;
  --text: #f4f1f9;
  --text-dim: #9891a8;
  --purple: #9161ff;
  --purple-deep: #6d3ce0;
  --purple-soft: rgba(145, 97, 255, .14);
  --glow: rgba(145, 97, 255, .38);
  --live: #ff3d68;
  --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
}
:root[data-theme=&#34;light&#34;] {
  --bg: #f4effb;
  --bg-soft: #ece2fa;
  --surface: #ffffff;
  --surface-2: #f1e9fa;
  --border: #ddccf3;
  --text: #1e1330;
  --text-dim: #756a92;
  --purple: #6d28d9;
  --purple-deep: #4c1d95;
  --purple-soft: rgba(109, 40, 217, .09);
  --glow: rgba(109, 40, 217, .22);
  --live: #d6265a;
  --shadow: 0 24px 50px -26px rgba(76, 29, 149, .22);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { color-scheme: dark; }
html[data-theme=&#34;light&#34;] { color-scheme: light; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: &#39;Inter&#39;, sans-serif;
  transition: background .3s ease, color .3s ease;
  min-height: 100vh;
  position: relative;
}

:root[data-theme=&#34;light&#34;] { --blob-blend: multiply; --blob-opacity: .3; }
:root:not([data-theme=&#34;light&#34;]) { --blob-blend: screen; --blob-opacity: .55; }

.bg-live {
  position: fixed;
  inset: -10%;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  will-change: transform;
  mix-blend-mode: var(--blob-blend);
}
.blob-a {
  width: 48vw; height: 48vw;
  top: -14%; left: -10%;
  background: radial-gradient(circle, var(--purple), transparent 70%);
  opacity: var(--blob-opacity);
  animation: driftA 30s ease-in-out infinite;
}
.blob-b {
  width: 42vw; height: 42vw;
  bottom: -16%; right: -8%;
  background: radial-gradient(circle, var(--purple-deep), transparent 70%);
  opacity: var(--blob-opacity);
  animation: driftB 36s ease-in-out infinite;
}
.blob-c {
  width: 32vw; height: 32vw;
  top: 38%; left: 54%;
  background: radial-gradient(circle, var(--purple), transparent 72%);
  opacity: calc(var(--blob-opacity) * .75);
  animation: driftC 42s ease-in-out infinite;
}
@keyframes driftA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(7vw, 5vh) scale(1.1); }
  66% { transform: translate(-4vw, 7vh) scale(.92); }
}
@keyframes driftB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-6vw, -7vh) scale(1.12); }
}
@keyframes driftC {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(5vw, -5vw) scale(1.18); }
}

.bg-texture {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: .4;
  mask-image: linear-gradient(180deg, transparent, black 18%, black 75%, transparent);
  -webkit-mask-image: linear-gradient(180deg, transparent, black 18%, black 75%, transparent);
}

h1, h2, h3, .brand-word { font-family: &#39;Sora&#39;, sans-serif; }

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 3px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ===== TOPBAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px clamp(16px, 4vw, 40px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--purple), var(--purple-deep));
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 8px 18px -6px var(--glow);
}
.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.brand-word {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.topbar-actions { display: flex; align-items: center; gap: 10px; }

.tg-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 15px;
  border-radius: 100px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: &#39;Inter&#39;, sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: border-color .2s, transform .15s;
}
.tg-btn:hover { border-color: var(--purple); transform: translateY(-1px); }
.tg-btn i { color: var(--purple); }

.theme-toggle {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--purple);
  transition: border-color .2s, transform .2s;
}
.theme-toggle:hover { border-color: var(--purple); transform: rotate(-12deg); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-moon { display: none; }
:root[data-theme=&#34;light&#34;] .theme-toggle .icon-sun { display: none; }
:root[data-theme=&#34;light&#34;] .theme-toggle .icon-moon { display: block; }

/* ===== LAYOUT ===== */
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px) 60px;
}

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 48px 0 18px;
}
.section-head h2 { font-size: 21px; margin: 0; font-weight: 700; }
.section-head span { color: var(--text-dim); font-size: 13.5px; }

/* ===== HERO ===== */
.hero {
  position: relative;
  border-radius: 26px;
  overflow: hidden;
  min-height: 340px;
  display: flex;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: saturate(1.05);
}
.hero-bg::after {
  content: &#34;&#34;;
  position: absolute; inset: 0;
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--bg) 92%, transparent) 8%, transparent 65%),
    linear-gradient(100deg, color-mix(in srgb, var(--bg) 55%, transparent) 10%, transparent 60%);
}
.hero-content {
  position: relative;
  padding: clamp(24px, 4vw, 42px);
  max-width: 620px;
}
.live-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--live);
  color: #fff;
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 14px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #fff;
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100%{ opacity: 1; transform: scale(1); } 50%{ opacity: .4; transform: scale(.7); } }

.hero-title { font-size: clamp(22px, 3.4vw, 32px); font-weight: 800; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; }
.hero-meta { color: var(--text-dim); font-size: 14px; margin: 0 0 22px; }

.watch-btn {
  display: inline-flex; align-items: center; gap: 9px;
  background: linear-gradient(135deg, var(--purple), var(--purple-deep));
  color: #fff;
  border: none;
  padding: 13px 24px;
  border-radius: 100px;
  font-family: &#39;Inter&#39;, sans-serif;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 14px 30px -12px var(--glow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.watch-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -12px var(--glow); }

.hero-empty {
  position: relative; padding: 50px clamp(24px, 4vw, 42px);
  text-align: left;
  width: 100%;
  background:
    radial-gradient(480px 260px at 88% -20%, var(--glow), transparent 65%),
    radial-gradient(420px 240px at 6% 130%, var(--purple-soft), transparent 60%);
}
.hero-empty h2 { font-size: 22px; margin: 0 0 6px; }
.hero-empty p { color: var(--text-dim); margin: 0; font-size: 14.5px; }

/* ===== LIVE GRID ===== */
.live-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 18px;
}
.match-card {
  background: linear-gradient(165deg, var(--surface), var(--surface-2));
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.match-card:hover { box-shadow: 0 18px 40px -22px var(--glow); }
.match-card:hover { border-color: var(--purple); transform: translateY(-3px); }
.card-img-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; height: auto; overflow: hidden; }
.card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.card-badge {
  position: absolute; top: 10px; left: 10px;
  display: flex; align-items: center; gap: 6px;
  background: var(--live);
  color: #fff;
  font-size: 11.5px; font-weight: 700;
  padding: 4px 10px;
  border-radius: 100px;
}
.card-body { padding: 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card-title { font-size: 15.5px; font-weight: 700; margin: 0; line-height: 1.3; }
.card-event { font-size: 12.5px; color: var(--purple); font-weight: 600; }
.card-time { font-size: 12.5px; color: var(--text-dim); margin: 0 0 10px; }
.card-watch {
  margin-top: auto;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--purple-soft);
  color: var(--purple);
  border: none;
  padding: 10px;
  border-radius: 12px;
  font-family: &#39;Inter&#39;, sans-serif;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  transition: background .2s ease;
}
.card-watch:hover { background: var(--purple); color: #fff; }

/* ===== UPCOMING LIST ===== */
.upcoming-list {
  display: flex; flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(165deg, var(--surface), var(--surface-2));
}
.upcoming-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.upcoming-row:last-child { border-bottom: none; }
.row-thumb {
  width: 52px; height: 52px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface-2);
}
.row-body { flex: 1; min-width: 0; }
.row-title {
  font-size: 14.5px; font-weight: 600; margin: 0 0 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-meta { font-size: 12.5px; color: var(--text-dim); }
.row-time {
  font-size: 12.5px; font-weight: 600; color: var(--text-dim);
  background: var(--surface-2);
  padding: 6px 12px;
  border-radius: 100px;
  white-space: nowrap;
}

.empty-msg, .error-msg {
  text-align: center; color: var(--text-dim); padding: 46px 20px; font-size: 14px;
}
.error-msg button {
  display: block; margin: 14px auto 0;
  background: var(--purple-soft); color: var(--purple);
  border: none; padding: 9px 18px; border-radius: 100px;
  font-family: &#39;Inter&#39;, sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 60px;
  padding: 26px clamp(16px, 4vw, 40px) 30px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12.5px;
}
.footer strong { color: var(--text); font-size: 12.5px; }
.footer strong { color: var(--text); }

@media (max-width: 520px) {
  .footer { flex-direction: column; align-items: flex-start; }
}
    </style>
  </head>
  <body>
    <div class="bg-live" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>

    <div class="bg-texture" aria-hidden="true">

    <header class="topbar">
      <a class="brand" href="https://t.me/cric_Kit" rel="noopener noreferrer" style="text-decoration:none;" target="_blank">      <span class="brand-mark">      <img src="https://i.ibb.co/7NT4hqnG/IMG-20261011-145051-119.jpg" alt="CRICHD" />
</span>
      <span class="brand-word">      CRICKIT
</span>
</a>
      <div class="topbar-actions">
        <a class="tg-btn" href="https://t.me/cric_Kit" rel="noopener noreferrer" target="_blank">        <i class="fab fa-telegram"></i>
        Join Telegram
</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2">
            </circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6">
            </path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">

    <script>
      const DATA_URL = &#34;https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json&#34;;
const PLAYER_URL = &#34;fcplay.html?id=&#34;;
const FALLBACK_IMG = &#34;https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg&#34;;

const heroEl = document.getElementById(&#34;hero&#34;);
const liveEl = document.getElementById(&#34;liveSection&#34;);
const upcomingEl = document.getElementById(&#34;upcomingSection&#34;);
let allMatches = [];

/* ===== THEME ===== */
function initTheme() {
  let theme = &#34;dark&#34;;
  try { theme = localStorage.getItem(&#34;cxp_theme&#34;) || &#34;dark&#34;; } catch (_) {}
  document.documentElement.setAttribute(&#34;data-theme&#34;, theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute(&#34;data-theme&#34;) === &#34;light&#34; ? &#34;light&#34; : &#34;dark&#34;;
  const next = current === &#34;light&#34; ? &#34;dark&#34; : &#34;light&#34;;
  document.documentElement.setAttribute(&#34;data-theme&#34;, next);
  try { localStorage.setItem(&#34;cxp_theme&#34;, next); } catch (_) {}
}
initTheme();
document.getElementById(&#34;themeToggle&#34;).addEventListener(&#34;click&#34;, toggleTheme);

/* ===== HELPERS ===== */
function escapeHtml(value) {
  return String(value ?? &#34;&#34;).replace(/[&amp;&lt;&gt;&#34;&#39;]/g, c =&gt; ({
    &#34;&amp;&#34;:&#34;&amp;amp;&#34;, &#34;&lt;&#34;:&#34;&amp;lt;&#34;, &#34;&gt;&#34;:&#34;&amp;gt;&#34;, &#39;&#34;&#39;:&#34;&amp;quot;&#34;, &#34;&#39;&#34;:&#34;&amp;#039;&#34;
  }[c]));
}
function formatDate(time) {
  if (!time) return &#34;&#34;;
  const d = new Date(time);
  if (Number.isNaN(d.getTime())) return time;
  return d.toLocaleString(&#34;en-IN&#34;, { day: &#34;numeric&#34;, month: &#34;short&#34;, hour: &#34;2-digit&#34;, minute: &#34;2-digit&#34; });
}
function isLive(m) { return String(m.status || &#34;&#34;).toUpperCase() === &#34;LIVE&#34;; }

function goToMatch(matchId) {
  const match = allMatches.find(m =&gt; String(m.match_id).toLowerCase() === String(matchId).toLowerCase());
  if (!match) { alert(&#34;Match not found&#34;); return; }
  try { sessionStorage.setItem(&#34;cxp_match_&#34; + matchId, JSON.stringify(match)); } catch (_) {}
  window.location.href = PLAYER_URL + encodeURIComponent(matchId);
}

/* ===== RENDER ===== */
function renderHero(match) {
  if (!match) {
    heroEl.innerHTML = `
      &lt;div class=&#34;hero&#34;&gt;
        &lt;div class=&#34;hero-empty&#34;&gt;
          &lt;h2&gt;No live matches right now&lt;/h2&gt;
          &lt;p&gt;Check back closer to the next scheduled match, or browse what&#39;s coming up below.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    return;
  }
  const img = match.src || FALLBACK_IMG;
  heroEl.innerHTML = `
    &lt;div class=&#34;hero&#34;&gt;
      &lt;div class=&#34;hero-bg&#34; style=&#34;background-image:url(&#39;${escapeHtml(img)}&#39;)&#34;&gt;&lt;/div&gt;
      &lt;div class=&#34;hero-content&#34;&gt;
        &lt;span class=&#34;live-pill&#34;&gt;&lt;span class=&#34;live-dot&#34;&gt;&lt;/span&gt; Live now&lt;/span&gt;
        &lt;h1 class=&#34;hero-title&#34;&gt;${escapeHtml(match.match_name || match.title || &#34;Match&#34;)}&lt;/h1&gt;
        &lt;p class=&#34;hero-meta&#34;&gt;${escapeHtml(match.event_name || &#34;&#34;)}${match.title ? &#34; · &#34; + escapeHtml(match.title) : &#34;&#34;}&lt;/p&gt;
        &lt;button class=&#34;watch-btn&#34; data-id=&#34;${escapeHtml(match.match_id)}&#34;&gt;
          &lt;i class=&#34;fas fa-play&#34;&gt;&lt;/i&gt; Watch now
        &lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  heroEl.querySelector(&#34;.watch-btn&#34;).addEventListener(&#34;click&#34;, () =&gt; goToMatch(match.match_id));
}

function renderLiveGrid(matches) {
  if (!matches.length) { liveEl.innerHTML = &#34;&#34;; return; }
  liveEl.innerHTML = `
    &lt;div class=&#34;section-head&#34;&gt;&lt;h2&gt;Live now&lt;/h2&gt;&lt;span&gt;${matches.length} match${matches.length &gt; 1 ? &#34;es&#34; : &#34;&#34;}&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&#34;live-grid&#34;&gt;
      ${matches.map(m =&gt; `
        &lt;div class=&#34;match-card&#34;&gt;
          &lt;div class=&#34;card-img-wrap&#34;&gt;
            &lt;img class=&#34;card-img&#34; src=&#34;${escapeHtml(m.src || FALLBACK_IMG)}&#34; loading=&#34;lazy&#34;&gt;
            &lt;span class=&#34;card-badge&#34;&gt;&lt;span class=&#34;live-dot&#34;&gt;&lt;/span&gt; Live&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&#34;card-body&#34;&gt;
            &lt;p class=&#34;card-event&#34;&gt;${escapeHtml(m.event_name || &#34;&#34;)}&lt;/p&gt;
            &lt;h3 class=&#34;card-title&#34;&gt;${escapeHtml(m.match_name || m.title || &#34;Match&#34;)}&lt;/h3&gt;
            &lt;p class=&#34;card-time&#34;&gt;${formatDate(m.startTime)}&lt;/p&gt;
            &lt;button class=&#34;card-watch&#34; data-id=&#34;${escapeHtml(m.match_id)}&#34;&gt;&lt;i class=&#34;fas fa-play&#34;&gt;&lt;/i&gt; Watch now&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `).join(&#34;&#34;)}
    &lt;/div&gt;`;
  liveEl.querySelectorAll(&#34;.card-watch&#34;).forEach(btn =&gt; {
    btn.addEventListener(&#34;click&#34;, () =&gt; goToMatch(btn.getAttribute(&#34;data-id&#34;)));
  });
}

function renderUpcoming(matches) {
  if (!matches.length) { upcomingEl.innerHTML = &#34;&#34;; return; }
  upcomingEl.innerHTML = `
    &lt;div class=&#34;section-head&#34;&gt;&lt;h2&gt;Coming up&lt;/h2&gt;&lt;span&gt;${matches.length} scheduled&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&#34;upcoming-list&#34;&gt;
      ${matches.map(m =&gt; `
        &lt;div class=&#34;upcoming-row&#34;&gt;
          &lt;img class=&#34;row-thumb&#34; src=&#34;${escapeHtml(m.src || FALLBACK_IMG)}&#34; loading=&#34;lazy&#34;&gt;
          &lt;div class=&#34;row-body&#34;&gt;
            &lt;p class=&#34;row-title&#34;&gt;${escapeHtml(m.match_name || m.title || &#34;Match&#34;)}&lt;/p&gt;
            &lt;p class=&#34;row-meta&#34;&gt;${escapeHtml(m.event_name || &#34;&#34;)}&lt;/p&gt;
          &lt;/div&gt;
          &lt;span class=&#34;row-time&#34;&gt;${formatDate(m.startTime)}&lt;/span&gt;
        &lt;/div&gt;
      `).join(&#34;&#34;)}
    &lt;/div&gt;`;
}

async function loadMatches() {
  heroEl.innerHTML = `&lt;p class=&#34;empty-msg&#34;&gt;Loading matches...&lt;/p&gt;`;
  try {
    const res = await fetch(DATA_URL, { cache: &#34;no-store&#34; });
    if (!res.ok) throw new Error(&#34;HTTP &#34; + res.status);

    const data = await res.json();
    allMatches = Array.isArray(data.matches) ? data.matches : [];

    const live = allMatches.filter(isLive);
    const scheduled = allMatches.filter(m =&gt; !isLive(m));

    renderHero(live[0] || null);
    renderLiveGrid(live.slice(1));
    renderUpcoming(scheduled);

    if (!allMatches.length) {
      heroEl.innerHTML = `&lt;p class=&#34;empty-msg&#34;&gt;No matches found&lt;/p&gt;`;
    }
  } catch (e) {
    console.error(e);
    heroEl.innerHTML = `
      &lt;p class=&#34;error-msg&#34;&gt;
        Failed to load matches.
        &lt;button id=&#34;retryLoad&#34;&gt;Retry&lt;/button&gt;
      &lt;/p&gt;`;
    const retryBtn = document.getElementById(&#34;retryLoad&#34;);
    if (retryBtn) retryBtn.addEventListener(&#34;click&#34;, loadMatches);
  }
}

loadMatches();
    </script>
  </body>
</html>
